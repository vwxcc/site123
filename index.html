<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;

            color: #1f1f1f;

        .sidebar {

        }

        .history-item:hover {
            background: #eeeeee;
        }

        .account {
            margin: 12px;
            padding: 12px;

            cursor: pointer;
        }

        .account:hover {
            background: #eeeeee;
        }

<body>

<div class="app">

    <!-- История -->
    <aside class="sidebar" id="sidebar">

        <div class="logo">
            ИИ
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ Новый чат
        </button>

        <div class="history-title">
            История
        </div>

        <div class="history" id="history">
            <div class="history-item">
                Новый чат
            </div>
        </div>

        <button class="account" onclick="accountClick()">
            👤 Аккаунт
        </button>

    </aside>

    <!-- Основная область -->
    <main class="main">

        <header class="topbar">

            <div style="display:flex;align-items:center;">
                <button class="mobile-menu" onclick="toggleSidebar()">
                    ☰
                </button>

                <div class="chat-title">
                    ИИ
                </div>
            </div>

        </header>

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">
                <h1>Чем могу помочь?</h1>
                <p>Напишите сообщение ниже</p>
            </div>

            <div class="messages" id="messages"></div>

        </section>

        <!-- Ввод -->
        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    placeholder="Напишите сообщение..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button class="send" onclick="sendMessage()">
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>

<script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const history = document.getElementById("history");

    async function sendMessage() {
    const text = input.value.trim();

    if (!text) return;

    welcome.style.display = "none";

    addMessage(text, "user");

    input.value = "";
    input.style.height = "42px";

    const historyData = [];

    document.querySelectorAll(".message").forEach(message => {
        const span = message.querySelector("span");

        if (!span) return;

        historyData.push({
            role: message.classList.contains("user")
                ? "user"
                : "assistant",
            content: span.textContent
        });
    });

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text,
                history: historyData.slice(0, -1)
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Ошибка запроса"
            );
        }

        addMessage(data.answer, "ai");
        addHistory(text);

    } catch (error) {
        console.error(error);

        addMessage(
            "Ошибка при обращении к ИИ: " + error.message,
            "ai"
        );
    }
}

    function addMessage(text, type) {
        const message = document.createElement("div");
        message.className = "message " + type;

        const bubble = document.createElement("span");
        bubble.textContent = text;

        message.appendChild(bubble);
        messages.appendChild(message);

        const chat = document.getElementById("chat");
        chat.scrollTop = chat.scrollHeight;
    }

    function addHistory(text) {
        const item = document.createElement("div");
        item.className = "history-item";
        item.textContent = text;

        history.prepend(item);
    }

    function newChat() {
        messages.innerHTML = "";
        welcome.style.display = "block";
        input.value = "";
        input.focus();
    }

    function accountClick() {
        alert("Раздел аккаунта пока находится в разработке.");
    }

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("open");
    }

    function handleKey(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    // Автоматическое изменение высоты поля
    input.addEventListener("input", function () {
        this.style.height = "42px";
        this.style.height = Math.min(this.scrollHeight, 150) + "px";
    });
</script>

</body>
</html>
