<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ИИ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #202020;
        }

        body {
            overflow: hidden;
        }

        button,
        textarea {
            font-family: inherit;
        }

        /* =========================
           APP
           ========================= */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* =========================
           SIDEBAR
           ========================= */

        .sidebar {
            width: 260px;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 18px 14px;
            border-right: 1px solid #ededed;
            background: #fff;
        }

        .logo {
            padding: 5px 10px 20px;
            font-size: 21px;
            font-weight: 700;
        }

        .new-chat {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #e1e1e1;
            border-radius: 12px;
            background: #fff;
            color: #222;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: background .15s, box-shadow .15s, border-color .15s;
        }

        .new-chat:hover {
            background: #fafafa;
            border-color: #d5d5d5;
            box-shadow: 0 2px 9px rgba(0, 0, 0, .05);
        }

        .history-title {
            margin: 25px 10px 9px;
            font-size: 12px;
            color: #8b8b8b;
        }

        .history {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .history-empty {
            padding: 10px;
            color: #999;
            font-size: 13px;
            line-height: 1.4;
        }

        .history-item {
            display: block;
            width: 100%;
            margin-bottom: 3px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #333;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background .15s, box-shadow .15s;
        }

        .history-item:hover {
            background: #f7f7f7;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .03);
        }

        .account {
            width: 100%;
            padding: 11px 10px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #333;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: background .15s, box-shadow .15s;
        }

        .account:hover {
            background: #f7f7f7;
            box-shadow: 0 1px 6px rgba(0, 0, 0, .03);
        }

        /* =========================
           MAIN
           ========================= */

        .main {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #fff;
        }

        /* =========================
           TOPBAR
           ========================= */

        .topbar {
            position: relative;
            z-index: 20;
            height: 60px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            padding: 0 22px;
            border-bottom: 1px solid #eeeeee;
            background: #fff;
        }

        .model-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 11px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #202020;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s, box-shadow .15s;
        }

        .model-button:hover {
            background: #f6f6f6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
        }

        .model-arrow {
            font-size: 12px;
            color: #777;
            transition: transform .15s;
        }

        .model-button.open .model-arrow {
            transform: rotate(180deg);
        }

        /* =========================
           MODEL MENU
           ========================= */

        .model-menu {
            position: absolute;
            top: 51px;
            left: 22px;
            width: 270px;
            padding: 6px;
            border: 1px solid #e4e4e4;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .10);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-5px) scale(.98);
            transform-origin: top left;
            transition: opacity .14s, transform .14s, visibility .14s;
        }

        .model-menu.open {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        .model-option {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 12px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #222;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: background .15s;
        }

        .model-option:hover {
            background: #f5f5f5;
        }

        .model-option.selected {
            background: #f3f3f3;
        }

        .check {
            width: 18px;
            color: #222;
            font-size: 14px;
            text-align: center;
        }

        /* =========================
           CHAT
           ========================= */

        .chat {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 30px 20px 155px;
        }

        .messages {
            width: min(850px, 100%);
            margin: 0 auto;
        }

        .welcome {
            min-height: 55vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
        }

        .message {
            display: flex;
            width: 100%;
            margin-bottom: 24px;
            line-height: 1.55;
            font-size: 15px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-content {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 18px;
            background: #f1f1f1;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.ai .message-content {
            max-width: 90%;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* =========================
           LOADING
           ========================= */

        .ai-loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #777;
        }

        .loading-dots {
            display: inline-flex;
            align-items: center;
            gap: 3px;
        }

        .loading-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #777;
            animation: loadingDot 1.2s infinite ease-in-out;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: .15s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes loadingDot {
            0%,
            60%,
            100% {
                opacity: .25;
                transform: translateY(0);
            }

            30% {
                opacity: 1;
                transform: translateY(-2px);
            }
        }

        /* =========================
           INPUT
           ========================= */

        .input-area {
            position: absolute;
            z-index: 10;
            right: 0;
            bottom: 0;
            left: 0;
            padding: 18px 20px 24px;
            background: linear-gradient(
                to top,
                #fff 72%,
                rgba(255, 255, 255, 0)
            );
        }

        .input-box {
            width: min(850px, 100%);
            min-height: 58px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 9px;
            padding: 8px 8px 8px 14px;
            border: 1px solid #dcdcdc;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 3px 15px rgba(0, 0, 0, .05);
            transition: border-color .15s, box-shadow .15s;
        }

        .input-box:focus-within {
            border-color: #cfcfcf;
            box-shadow: 0 4px 18px rgba(0, 0, 0, .07);
        }

        #input {
            flex: 1;
            width: 100%;
            min-height: 40px;
            max-height: 160px;
            padding: 9px 2px;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            color: #202020;
            font-size: 15px;
            line-height: 1.4;
        }

        #input::placeholder {
            color: #999;
        }

        #send {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: none;
            border-radius: 50%;
            background: #202020;
            color: #fff;
            font-size: 19px;
            line-height: 1;
            cursor: pointer;
            transition: opacity .15s, transform .15s, box-shadow .15s;
        }

        #send:hover:not(:disabled) {
            opacity: .88;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
        }

        #send:active:not(:disabled) {
            transform: translateY(0);
        }

        #send:disabled {
            opacity: .4;
            cursor: default;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 700px) {

            .sidebar {
                display: none;
            }

            .topbar {
                height: 56px;
                padding: 0 10px;
            }

            .model-button {
                padding: 8px 10px;
            }

            .model-menu {
                top: 49px;
                left: 10px;
                right: 10px;
                width: auto;
            }

            .chat {
                padding: 25px 13px 140px;
            }

            .welcome {
                min-height: 55vh;
                font-size: 24px;
            }

            .message.user .message-content {
                max-width: 88%;
            }

            .message.ai .message-content {
                max-width: 95%;
            }

            .input-area {
                padding: 11px 10px 16px;
            }

            .input-box {
                min-height: 56px;
                border-radius: 17px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            ИИ
        </div>

        <button
            class="new-chat"
            id="newChat"
        >
            ＋ Новый чат
        </button>

        <div class="history-title">
            История
        </div>

        <div
            class="history"
            id="history"
        >
        </div>

        <button
            class="account"
            id="accountButton"
        >
            👤 Аккаунт
        </button>

    </aside>


    <main class="main">

        <header class="topbar">

            <button
                class="model-button"
                id="modelButton"
            >
                <span id="selectedModel">
                    GPT-5.4 Mini
                </span>

                <span class="model-arrow">
                    ▾
                </span>
            </button>


            <div
                class="model-menu"
                id="modelMenu"
            >

                <button
                    class="model-option selected"
                    data-model="gpt"
                    data-name="GPT-5.4 Mini"
                >
                    <span>
                        GPT-5.4 Mini
                    </span>

                    <span class="check">
                        ✓
                    </span>
                </button>


                <button
                    class="model-option"
                    data-model="gemini"
                    data-name="Gemini 3.1 Pro Preview"
                >
                    <span>
                        Gemini 3.1 Pro Preview
                    </span>

                    <span class="check">
                    </span>
                </button>


                <button
                    class="model-option"
                    data-model="qwen"
                    data-name="Qwen 3.5 Plus"
                >
                    <span>
                        Qwen 3.5 Plus
                    </span>

                    <span class="check">
                    </span>
                </button>

            </div>

        </header>


        <section
            class="chat"
            id="chat"
        >

            <div
                class="messages"
                id="messages"
            >

                <div
                    class="welcome"
                    id="welcome"
                >
                    Чем могу помочь?
                </div>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="input"
                    rows="1"
                    placeholder="Напишите сообщение..."
                ></textarea>

                <button
                    id="send"
                    title="Отправить"
                    aria-label="Отправить"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<script>

    /* =========================
       ELEMENTS
       ========================= */

    const input =
        document.getElementById("input");

    const send =
        document.getElementById("send");

    const messages =
        document.getElementById("messages");

    const welcome =
        document.getElementById("welcome");

    const chat =
        document.getElementById("chat");

    const newChat =
        document.getElementById("newChat");

    const historyElement =
        document.getElementById("history");

    const modelButton =
        document.getElementById("modelButton");

    const modelMenu =
        document.getElementById("modelMenu");

    const selectedModel =
        document.getElementById("selectedModel");

    const modelOptions =
        document.querySelectorAll(
            ".model-option"
        );


    /* =========================
       STATE
       ========================= */

    let conversationHistory = [];

    let isGenerating = false;

    let selectedModelKey = "gpt";

    let currentChatTitle = "Новый чат";


    /* =========================
       LOCAL STORAGE
       ========================= */

    function saveHistory() {

        try {

            localStorage.setItem(
                "ai_conversation_history",
                JSON.stringify(
                    conversationHistory
                )
            );

        } catch (error) {

            console.log(
                "Не удалось сохранить историю",
                error
            );
        }
    }


    function loadHistory() {

        try {

            const saved =
                localStorage.getItem(
                    "ai_conversation_history"
                );


            if (!saved) {

                renderHistory();

                return;
            }


            const parsed =
                JSON.parse(saved);


            if (
                Array.isArray(parsed)
            ) {

                conversationHistory =
                    parsed;
            }


        } catch (error) {

            conversationHistory =
                [];
        }


        renderHistory();
    }


    /* =========================
       HISTORY SIDEBAR
       ========================= */

    function renderHistory() {

        historyElement.innerHTML =
            "";


        if (
            conversationHistory.length === 0
        ) {

            const empty =
                document.createElement("div");

            empty.className =
                "history-empty";

            empty.textContent =
                "История пока пуста";

            historyElement.appendChild(
                empty
            );

            return;
        }


        /*
         * Показываем названия чатов.
         * Пока каждый новый чат хранится
         * как отдельная запись.
         */

        const item =
            document.createElement("button");

        item.className =
            "history-item";

        item.textContent =
            currentChatTitle;


        item.addEventListener(
            "click",
            () => {

                restoreCurrentChat();

            }
        );


        historyElement.appendChild(
            item
        );
    }


    function restoreCurrentChat() {

        messages.innerHTML =
            "";


        if (
            conversationHistory.length === 0
        ) {

            showWelcome();

            return;
        }


        conversationHistory.forEach(
            message => {

                if (
                    message.role === "user"
                ) {

                    addMessageElement(
                        message.content,
                        "user"
                    );

                } else if (
                    message.role === "assistant"
                ) {

                    addMessageElement(
                        message.content,
                        "ai"
                    );
                }

            }
        );


        scrollToBottom();
    }


    /* =========================
       ADD MESSAGE
       ========================= */

    function addMessageElement(
        text,
        role
    ) {

        const message =
            document.createElement("div");

        message.className =
            "message " + role;


        const content =
            document.createElement("div");

        content.className =
            "message-content";

        content.textContent =
            text;


        message.appendChild(
            content
        );

        messages.appendChild(
            message
        );


        return content;
    }


    function showWelcome() {

        messages.innerHTML =
            `
            <div
                class="welcome"
                id="welcome"
            >
                Чем могу помочь?
            </div>
            `;
    }


    function scrollToBottom() {

        requestAnimationFrame(
            () => {

                chat.scrollTop =
                    chat.scrollHeight;

            }
        );
    }


    /* =========================
       MODEL MENU
       ========================= */

    modelButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            const isOpen =
                modelMenu.classList.contains(
                    "open"
                );


            if (isOpen) {

                closeModelMenu();

            } else {

                modelMenu.classList.add(
                    "open"
                );

                modelButton.classList.add(
                    "open"
                );
            }
        }
    );


    modelOptions.forEach(
        option => {

            option.addEventListener(
                "click",
                function(event) {

                    event.stopPropagation();


                    selectedModelKey =
                        this.dataset.model;


                    selectedModel.textContent =
                        this.dataset.name;


                    modelOptions.forEach(
                        item => {

                            item.classList.remove(
                                "selected"
                            );

                            item.querySelector(
                                ".check"
                            ).textContent =
                                "";
                        }
                    );


                    this.classList.add(
                        "selected"
                    );


                    this.querySelector(
                        ".check"
                    ).textContent =
                        "✓";


                    closeModelMenu();
                }
            );
        }
    );


    function closeModelMenu() {

        modelMenu.classList.remove(
            "open"
        );

        modelButton.classList.remove(
            "open"
        );
    }


    document.addEventListener(
        "click",
        function() {

            closeModelMenu();

        }
    );


    /* =========================
       SEND MESSAGE
       ========================= */

    async function sendMessage() {

        const text =
            input.value.trim();


        if (
            !text ||
            isGenerating
        ) {

            return;
        }


        isGenerating =
            true;

        send.disabled =
            true;


        if (welcome) {

            welcome.style.display =
                "none";
        }


        addMessageElement(
            text,
            "user"
        );


        if (
            currentChatTitle ===
            "Новый чат"
        ) {

            currentChatTitle =
                text.length > 35
                    ? text.substring(0, 35) + "..."
                    : text;
        }


        const historyForServer =
            conversationHistory.slice(-20);


        input.value =
            "";

        input.style.height =
            "40px";


        /* =====================
           AI MESSAGE
           ===================== */

        const message =
            document.createElement("div");

        message.className =
            "message ai";


        const content =
            document.createElement("div");

        content.className =
            "message-content";


        const loading =
            document.createElement("div");

        loading.className =
            "ai-loading";


        const loadingText =
            document.createElement("span");

        loadingText.textContent =
            "Рассуждение";


        const dots =
            document.createElement("div");

        dots.className =
            "loading-dots";


        for (
            let i = 0;
            i < 3;
            i++
        ) {

            const dot =
                document.createElement("span");

            dots.appendChild(
                dot
            );
        }


        loading.appendChild(
            loadingText
        );

        loading.appendChild(
            dots
        );

        content.appendChild(
            loading
        );

        message.appendChild(
            content
        );

        messages.appendChild(
            message
        );


        scrollToBottom();


        /* =====================
           LOADING WORDS
           ===================== */

        const statuses = [
            "Рассуждение",
            "Анализирую",
            "Думаю",
            "Формирую ответ",
            "Проверяю",
            "Готовлю ответ"
        ];


        let statusIndex = 0;


        const statusTimer =
            setInterval(
                () => {

                    statusIndex =
                        (
                            statusIndex + 1
                        ) %
                        statuses.length;


                    loadingText.textContent =
                        statuses[
                            statusIndex
                        ];

                },
                2000
            );


        let fullAnswer =
            "";

        let gotFirstToken =
            false;


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                message:
                                    text,

                                history:
                                    historyForServer,

                                model:
                                    selectedModelKey

                            })
                    }
                );


            if (!response.ok) {

                let errorMessage =
                    "Ошибка сервера";


                try {

                    const errorData =
                        await response.json();


                    if (
                        errorData.error
                    ) {

                        errorMessage =
                            errorData.error;
                    }

                } catch (error) {

                    const raw =
                        await response.text();

                    if (raw) {
                        errorMessage =
                            raw;
                    }
                }


                throw new Error(
                    errorMessage
                );
            }


            if (!response.body) {

                throw new Error(
                    "Сервер не поддерживает streaming"
                );
            }


            const reader =
                response.body.getReader();


            const decoder =
                new TextDecoder(
                    "utf-8"
                );


            let buffer =
                "";


            while (true) {

                const result =
                    await reader.read();


                if (result.done) {

                    break;
                }


                buffer +=
                    decoder.decode(
                        result.value,
                        {
                            stream: true
                        }
                    );


                const lines =
                    buffer.split("\n");


                buffer =
                    lines.pop() || "";


                for (
                    const line of lines
                ) {

                    if (
                        !line.startsWith(
                            "data: "
                        )
                    ) {

                        continue;
                    }


                    const data =
                        line.substring(
                            6
                        ).trim();


                    if (
                        data ===
                        "[DONE]"
                    ) {

                        continue;
                    }


                    try {

                        const event =
                            JSON.parse(
                                data
                            );


                        if (
                            event.error
                        ) {

                            throw new Error(
                                event.error
                            );
                        }


                        if (
                            event.type ===
                                "text" &&
                            event.text
                        ) {

                            if (
                                !gotFirstToken
                            ) {

                                gotFirstToken =
                                    true;


                                clearInterval(
                                    statusTimer
                                );


                                loading.remove();


                                content.textContent =
                                    "";
                            }


                            fullAnswer +=
                                event.text;


                            content.textContent =
                                fullAnswer;


                            scrollToBottom();
                        }

                    } catch (error) {

                        if (
                            error.message &&
                            !error.message.includes(
                                "Unexpected token"
                            )
                        ) {

                            throw error;
                        }
                    }
                }
            }


            clearInterval(
                statusTimer
            );


            if (!fullAnswer) {

                loading.remove();

                content.textContent =
                    "ИИ не вернул ответ.";
            }


            /* =====================
               SAVE HISTORY
               ===================== */

            conversationHistory.push(
                {
                    role: "user",
                    content: text
                }
            );


            conversationHistory.push(
                {
                    role: "assistant",
                    content:
                        fullAnswer
                }
            );


            saveHistory();

            renderHistory();


        } catch (error) {

            clearInterval(
                statusTimer
            );


            loading.remove();


            content.textContent =
                "Ошибка: " +
                error.message;


            console.error(
                "Chat error:",
                error
            );

        } finally {

            /*
             * Кнопка ВСЕГДА снова активируется,
             * даже если произошла ошибка.
             */

            isGenerating =
                false;

            send.disabled =
                false;

            input.focus();

            scrollToBottom();
        }
    }


    /* =========================
       SEND BUTTON
       ========================= */

    send.addEventListener(
        "click",
        sendMessage
    );


    /* =========================
       ENTER
       ========================= */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();
            }
        }
    );


    /* =========================
       TEXTAREA AUTO SIZE
       ========================= */

    input.addEventListener(
        "input",
        function() {

            this.style.height =
                "40px";


            this.style.height =
                Math.min(
                    this.scrollHeight,
                    160
                ) + "px";
        }
    );


    /* =========================
       NEW CHAT
       ========================= */

    newChat.addEventListener(
        "click",
        function() {

            conversationHistory =
                [];

            currentChatTitle =
                "Новый чат";


            saveHistory();

            renderHistory();

            showWelcome();


            input.value =
                "";

            input.style.height =
                "40px";


            input.focus();
        }
    );


    /* =========================
       INITIALIZE
       ========================= */

    loadHistory();

    input.focus();

</script>

</body>
</html>
