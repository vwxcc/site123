<title>ИИ</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        background: #fff;
        color: #202020;
    }

    body {
        overflow: hidden;
    }

    button,
    textarea {
        font-family: inherit;
    }

    .app {
        display: flex;
        width: 100%;
        height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
        width: 260px;
        height: 100%;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        padding: 18px 14px;
        border-right: 1px solid #ededed;
        background: #fff;
    }

    .logo {
        padding: 5px 10px 20px;
        font-size: 21px;
        font-weight: 700;
    }

    .new-chat {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid #e1e1e1;
        border-radius: 12px;
        background: #fff;
        color: #222;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
        transition:
            background .15s,
            box-shadow .15s,
            border-color .15s,
            transform .15s;
    }

    .new-chat:hover {
        background: #fafafa;
        border-color: #d5d5d5;
        box-shadow: 0 2px 9px rgba(0, 0, 0, .05);
        transform: translateY(-1px);
    }

    .history-title {
        margin: 25px 10px 9px;
        font-size: 12px;
        color: #8b8b8b;
    }

    .history {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
    }

    .history-empty {
        padding: 10px;
        color: #999;
        font-size: 13px;
        line-height: 1.4;
    }

    .history-item {
        display: block;
        width: 100%;
        margin-bottom: 3px;
        padding: 10px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: #333;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition:
            background .15s,
            box-shadow .15s,
            transform .15s;
    }

    .history-item:hover {
        background: #f7f7f7;
        box-shadow: 0 1px 6px rgba(0, 0, 0, .03);
        transform: translateX(1px);
    }

    .account {
        width: 100%;
        padding: 11px 10px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: #333;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
        transition:
            background .15s,
            box-shadow .15s;
    }

    .account:hover {
        background: #f7f7f7;
        box-shadow: 0 1px 6px rgba(0, 0, 0, .03);
    }

    /* MAIN */

    .main {
        position: relative;
        flex: 1;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: #fff;
    }

    /* TOPBAR */

    .topbar {
        position: relative;
        z-index: 20;
        height: 60px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        padding: 0 22px;
        border-bottom: 1px solid #eeeeee;
        background: #fff;
    }

    .model-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: #202020;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
            background .15s,
            box-shadow .15s;
    }

    .model-button:hover {
        background: #f6f6f6;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
    }

    .model-arrow {
        font-size: 12px;
        color: #777;
        transition: transform .15s;
    }

    .model-button.open .model-arrow {
        transform: rotate(180deg);
    }

    /* MODEL MENU */

    .model-menu {
        position: absolute;
        top: 51px;
        left: 22px;
        width: 270px;
        padding: 6px;
        border: 1px solid #e4e4e4;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 35px rgba(0, 0, 0, .10);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-5px) scale(.98);
        transform-origin: top left;
        transition:
            opacity .14s,
            transform .14s,
            visibility .14s;
    }

    .model-menu.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
    }

    .model-option {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 11px 12px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: #222;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
        transition: background .15s;
    }

    .model-option:hover {
        background: #f5f5f5;
    }

    .model-option.selected {
        background: #f3f3f3;
    }

    .check {
        width: 18px;
        color: #222;
        font-size: 14px;
        text-align: center;
    }

    /* CHAT */

    .chat {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 30px 20px 155px;
    }

    .messages {
        width: min(850px, 100%);
        margin: 0 auto;
    }

    .welcome {
        min-height: 55vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-size: 28px;
        font-weight: 600;
        text-align: center;
        opacity: 1;
        transform: translateY(0);
        transition:
            opacity .35s ease,
            transform .35s ease;
    }

    .welcome.changing {
        opacity: 0;
        transform: translateY(4px);
    }

    .message {
        display: flex;
        width: 100%;
        margin-bottom: 24px;
        line-height: 1.55;
        font-size: 15px;
    }

    .message.user {
        justify-content: flex-end;
    }

    .message.user .message-content {
        max-width: 75%;
        padding: 10px 15px;
        border-radius: 18px;
        background: #f1f1f1;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .message.ai {
        justify-content: flex-start;
    }

    .message.ai .message-content {
        max-width: 90%;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    /* LOADING */

    .ai-loading {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #777;
    }

    .loading-dots {
        display: inline-flex;
        align-items: center;
        gap: 3px;
    }

    .loading-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #777;
        animation: loadingDot 1.2s infinite ease-in-out;
    }

    .loading-dots span:nth-child(2) {
        animation-delay: .15s;
    }

    .loading-dots span:nth-child(3) {
        animation-delay: .3s;
    }

    @keyframes loadingDot {
        0%,
        60%,
        100% {
            opacity: .25;
            transform: translateY(0);
        }

        30% {
            opacity: 1;
            transform: translateY(-2px);
        }
    }

    /* INPUT */

    .input-area {
        position: absolute;
        z-index: 10;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 18px 20px 24px;
        background: linear-gradient(
            to top,
            #fff 72%,
            rgba(255, 255, 255, 0)
        );
    }

    .input-box {
        width: min(850px, 100%);
        min-height: 58px;
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        gap: 9px;
        padding: 8px 8px 8px 14px;
        border: 1px solid #dcdcdc;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 3px 15px rgba(0, 0, 0, .05);
        transition:
            border-color .15s,
            box-shadow .15s;
    }

    .input-box:focus-within {
        border-color: #cfcfcf;
        box-shadow: 0 4px 18px rgba(0, 0, 0, .07);
    }

    #input {
        flex: 1;
        width: 100%;
        min-height: 40px;
        max-height: 160px;
        padding: 9px 2px;
        border: none;
        outline: none;
        resize: none;
        background: transparent;
        color: #202020;
        font-size: 15px;
        line-height: 1.4;
    }

    #input::placeholder {
        color: #999;
        transition: opacity .2s ease;
    }

    #send {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: #202020;
        color: #fff;
        font-size: 19px;
        line-height: 1;
        cursor: pointer;
        transition:
            opacity .15s,
            transform .15s,
            box-shadow .15s;
    }

    #send:hover:not(:disabled) {
        opacity: .88;
        transform: translateY(-1px);
        box-shadow: 0 3px 10px rgba(0, 0, 0, .12);
    }

    #send:active:not(:disabled) {
        transform: translateY(0);
    }

    #send:disabled {
        opacity: .4;
        cursor: default;
        transform: none;
        box-shadow: none;
    }

    /* MOBILE */

    @media (max-width: 700px) {
        .sidebar {
            display: none;
        }

        .topbar {
            height: 56px;
            padding: 0 10px;
        }

        .model-button {
            padding: 8px 10px;
        }

        .model-menu {
            top: 49px;
            left: 10px;
            right: 10px;
            width: auto;
        }

        .chat {
            padding: 25px 13px 140px;
        }

        .welcome {
            min-height: 55vh;

        .message.user .message-content {

        }

        .input-area {
            padding: 11px 10px 16px;
        }

        .input-box {
            min-height: 56px;
            border-radius: 17px;
        }
    }

</div>

<script>
    /* =========================
       ELEMENTS
       ========================= */

    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const messages = document.getElementById("messages");
    const chat = document.getElementById("chat");
    const newChat = document.getElementById("newChat");
    const historyElement = document.getElementById("history");

    const modelButton = document.getElementById("modelButton");
    const modelMenu = document.getElementById("modelMenu");
    const selectedModel = document.getElementById("selectedModel");

    const modelOptions =
        document.querySelectorAll(".model-option");


    /* =========================
       STATE
       ========================= */

    let conversationHistory = [];

    let isGenerating = false;

    let selectedModelKey = "gemini";

    let currentChatTitle = "Новый чат";

    let welcomeTimer = null;

    let placeholderTimer = null;


    /* =========================
       WELCOME PHRASES
       ========================= */

    const welcomePhrases = [
        "Чем могу помочь?",
        "Что хотите узнать?",
        "Как дела?",
        "С чего начнём?",
        "Что будем делать?",
        "Есть вопрос?",
        "Что вас интересует?",
        "Готов помочь.",
        "Что подсказать?",
        "Что хотите обсудить?",
        "Давайте начнём.",
        "О чём поговорим?"
    ];


    /* =========================
       PLACEHOLDERS
       ========================= */

    const placeholders = [
        "Введите текст...",
        "Задайте вопрос...",
        "Что хотите узнать?",
        "Напишите свой вопрос...",
        "Спросите что-нибудь...",
        "Чем вам помочь?",
        "Введите сообщение...",
        "Что вас интересует?",
        "Опишите задачу...",
        "Нужна помощь с чем-то?",
        "Что будем делать?",
        "Расскажите, что нужно сделать...",
        "Задайте любую задачу...",
        "Что хотите обсудить?",
        "Напишите, что вас интересует...",
        "Есть вопрос? Задавайте...",
        "Что подсказать?",
        "С чего начнём?",
        "Введите свой запрос...",
        "Попробуйте задать вопрос..."
    ];


    /* =========================
       RANDOM HELPERS
       ========================= */

    function randomItem(array) {
        return array[
            Math.floor(Math.random() * array.length)
        ];
    }


    function setRandomPlaceholder() {
        if (!input) {
            return;
        }

        input.placeholder = randomItem(placeholders);
    }


    /* =========================
       WELCOME ANIMATION
       ========================= */

    function stopWelcomeAnimation() {
        if (welcomeTimer) {
            clearInterval(welcomeTimer);
            welcomeTimer = null;
        }
    }


    function startWelcomeAnimation() {
        stopWelcomeAnimation();

        const welcomeElement =
            document.getElementById("welcome");

        if (!welcomeElement) {
            return;
        }

        let currentText =
            welcomeElement.textContent.trim();

        let available =
            welcomePhrases.filter(
                phrase => phrase !== currentText
            );

        welcomeTimer = setInterval(() => {

            const current =
                document.getElementById("welcome");

            if (!current) {
                stopWelcomeAnimation();
                return;
            }

            current.classList.add("changing");

            setTimeout(() => {

                const element =
                    document.getElementById("welcome");

                if (!element) {
                    return;
                }

                available =
                    welcomePhrases.filter(
                        phrase =>
                            phrase !== element.textContent
                    );

                const next =
                    randomItem(available);

                element.textContent = next;

                element.classList.remove("changing");

            }, 350);

        }, 2000);
    }


    /* =========================
       LOCAL STORAGE
       ========================= */

    function saveHistory() {
        try {
            localStorage.setItem(
                "ai_conversation_history",
                JSON.stringify(conversationHistory)
            );
        } catch (error) {
            console.log(
                "Не удалось сохранить историю",
                error
            );
        }
    }


    function loadHistory() {

        try {

            const saved =
                localStorage.getItem(
                    "ai_conversation_history"
                );

            if (!saved) {
                renderHistory();
                return;
            }

            const parsed =
                JSON.parse(saved);

            if (Array.isArray(parsed)) {
                conversationHistory = parsed;
            }

        } catch (error) {

            conversationHistory = [];

        }

        renderHistory();
    }


    /* =========================
       HISTORY
       ========================= */

    function renderHistory() {

        historyElement.innerHTML = "";

        if (conversationHistory.length === 0) {

            const empty =
                document.createElement("div");

            empty.className =
                "history-empty";

            empty.textContent =
                "История пока пуста";

            historyElement.appendChild(empty);

            return;
        }

        const item =
            document.createElement("button");

        item.className =
            "history-item";

        item.type = "button";

        item.textContent =
            currentChatTitle;

        item.addEventListener(
            "click",
            restoreCurrentChat
        );

        historyElement.appendChild(item);
    }


    function restoreCurrentChat() {

        stopWelcomeAnimation();

        messages.innerHTML = "";

        if (conversationHistory.length === 0) {
            showWelcome();
            return;
        }

        conversationHistory.forEach(message => {

            if (message.role === "user") {

                addMessageElement(
                    message.content,
                    "user"
                );

            } else if (
                message.role === "assistant"
            ) {

                addMessageElement(
                    cleanAnswer(message.content),
                    "ai"
                );
            }
        });

        scrollToBottom();
    }


    /* =========================
       ANSWER CLEANING
       ========================= */

    function cleanAnswer(text) {

        if (!text) {
            return "";
        }

        let result = String(text);

        /*
         * Убираем markdown-заголовки:
         * ### Заголовок -> Заголовок
         */
        result =
            result.replace(
                /^\s*#{1,6}\s*/gm,
                ""
            );

        /*
         * Убираем строки, состоящие
         * только из декоративных символов.
         */
        result =
            result.replace(
                /^\s*(?:\*{3,}|_{3,}|-{3,}|={3,}|~{3,})\s*$/gm,
                ""
            );

        /*
         * Убираем подряд идущие
         * декоративные звёздочки.
         */
        result =
            result.replace(
                /(\*{3,})/g,
                ""
            );

        /*
         * Убираем подряд идущие решётки.
         */
        result =
            result.replace(
                /#{3,}/g,
                ""
            );

        /*
         * Убираем подряд идущие подчёркивания.
         */
        result =
            result.replace(
                /_{3,}/g,
                ""
            );

        /*
         * Убираем чрезмерные пустые строки.
         */
        result =
            result.replace(
                /\n{3,}/g,
                "\n\n"
            );

        /*
         * Убираем пробелы перед переносами.
         */
        result =
            result.replace(
                /[ \t]+\n/g,
                "\n"
            );

        return result.trim();
    }


    /* =========================
       ADD MESSAGE
       ========================= */

    function addMessageElement(text, role) {

        const message =
            document.createElement("div");

        message.className =
            "message " + role;

        const content =
            document.createElement("div");

        content.className =
            "message-content";

        content.textContent =
            role === "ai"
                ? cleanAnswer(text)
                : text;

        message.appendChild(content);

        messages.appendChild(message);

        return content;
    }


    /* =========================
       WELCOME
       ========================= */

    function showWelcome() {

        stopWelcomeAnimation();

        messages.innerHTML = `
            <div
                class="welcome"
                id="welcome"
            >
                ${randomItem(welcomePhrases)}
            </div>
        `;

        startWelcomeAnimation();
    }


    function hideWelcome() {

        const welcome =
            document.getElementById("welcome");

        if (!welcome) {
            return;
        }

        welcome.classList.add("changing");

        setTimeout(() => {

            const current =
                document.getElementById("welcome");

            if (current) {
                current.style.display = "none";
            }

        }, 350);

        stopWelcomeAnimation();
    }


    /* =========================
       SCROLL
       ========================= */

    function scrollToBottom() {

        requestAnimationFrame(() => {

            chat.scrollTop =
                chat.scrollHeight;

        });
    }


    /* =========================
       MODEL MENU
       ========================= */

    function closeModelMenu() {

        modelMenu.classList.remove("open");

        modelButton.classList.remove("open");

        modelButton.setAttribute(
            "aria-expanded",
            "false"
        );
    }


    modelButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            const isOpen =
                modelMenu.classList.contains("open");

            if (isOpen) {

                closeModelMenu();

            } else {

                modelMenu.classList.add("open");

                modelButton.classList.add("open");

                modelButton.setAttribute(
                    "aria-expanded",
                    "true"
                );
            }
        }
    );


    modelOptions.forEach(option => {

        option.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                if (isGenerating) {
                    return;
                }

                selectedModelKey =
                    this.dataset.model;

                selectedModel.textContent =
                    this.dataset.name;

                modelOptions.forEach(item => {

                    item.classList.remove("selected");

                    const check =
                        item.querySelector(".check");

                    if (check) {
                        check.textContent = "";
                    }
                });

                this.classList.add("selected");

                this.querySelector(".check")
                    .textContent = "✓";

                closeModelMenu();
            }
        );
    });


    document.addEventListener(
        "click",
        function() {
            closeModelMenu();
        }
    );


    /* =========================
       SEND MESSAGE
       ========================= */

    async function sendMessage() {

        /*
         * Самая ранняя защита.
         * Повторный click / Enter во время
         * запроса ничего не делает.
         */
        if (isGenerating) {
            return;
        }

        const text =
            input.value.trim();

        if (!text) {
            input.focus();
            return;
        }

        /*
         * Блокируем запрос ДО любой
         * асинхронной операции.
         */
        isGenerating = true;
        send.disabled = true;
        input.disabled = true;

        hideWelcome();

        /*
         * ВАЖНО:
         * добавляем новое сообщение в историю
         * ДО отправки на сервер.
         *
         * Поэтому второй запрос уже получает
         * первый вопрос пользователя.
         */
        conversationHistory.push({
            role: "user",
            content: text
        });

        if (
            currentChatTitle === "Новый чат"
        ) {

            currentChatTitle =
                text.length > 35
                    ? text.substring(0, 35) + "..."
                    : text;
        }

        const historyForServer =
            conversationHistory.slice(-20);

        input.value = "";

        input.style.height = "40px";

        renderHistory();


        /* =====================
           AI MESSAGE
           ===================== */

        const message =
            document.createElement("div");

        message.className =
            "message ai";

        const content =
            document.createElement("div");

        content.className =
            "message-content";

        const loading =
            document.createElement("div");

        loading.className =
            "ai-loading";

        const loadingText =
            document.createElement("span");

        loadingText.textContent =
            "Рассуждение";

        const dots =
            document.createElement("div");

        dots.className =
            "loading-dots";

        for (let i = 0; i < 3; i++) {

            const dot =
                document.createElement("span");

            dots.appendChild(dot);
        }

        loading.appendChild(loadingText);
        loading.appendChild(dots);

        content.appendChild(loading);
        message.appendChild(content);
        messages.appendChild(message);

        scrollToBottom();


        /* =====================
           LOADING STATUS
           ===================== */

        const statuses = [
            "Рассуждение",
            "Анализирую",
            "Думаю",
            "Формирую ответ",
            "Проверяю",
            "Готовлю ответ"
        ];

        let statusIndex = 0;

        const statusTimer =
            setInterval(() => {

                statusIndex =
                    (statusIndex + 1) %
                    statuses.length;

                loadingText.textContent =
                    statuses[statusIndex];

            }, 2000);


        let fullAnswer = "";
        let gotFirstToken = false;


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message: text,

                            history:
                                historyForServer.slice(
                                    0,
                                    -1
                                ),

                            model:
                                selectedModelKey
                        })
                    }
                );


            if (!response.ok) {

                let errorMessage =
                    "Ошибка сервера";

                try {

                    const errorData =
                        await response.json();

                    if (errorData.error) {
                        errorMessage =
                            errorData.error;
                    }

                } catch (error) {

                    try {

                        const raw =
                            await response.text();

                        if (raw) {
                            errorMessage = raw;
                        }

                    } catch (_) {
                        /* ignore */
                    }
                }

                throw new Error(errorMessage);
            }


            if (!response.body) {

                throw new Error(
                    "Сервер не поддерживает streaming"
                );
            }


            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder("utf-8");

            let buffer = "";


            while (true) {

                const result =
                    await reader.read();

                if (result.done) {
                    break;
                }

                buffer +=
                    decoder.decode(
                        result.value,
                        {
                            stream: true
                        }
                    );

                const lines =
                    buffer.split("\n");

                buffer =
                    lines.pop() || "";


                for (const line of lines) {

                    if (
                        !line.startsWith("data: ")
                    ) {
                        continue;
                    }

                    const data =
                        line
                            .substring(6)
                            .trim();


                    if (data === "[DONE]") {
                        continue;
                    }


                    try {

                        const event =
                            JSON.parse(data);


                        if (event.error) {
                            throw new Error(
                                event.error
                            );
                        }


                        if (
                            event.type === "text" &&
                            event.text
                        ) {

                            if (!gotFirstToken) {

                                gotFirstToken = true;

                                clearInterval(
                                    statusTimer
                                );

                                loading.remove();

                                content.textContent =
                                    "";
                            }


                            fullAnswer +=
                                event.text;

                            /*
                             * Во время streaming
                             * тоже очищаем декоративный
                             * мусор.
                             */
                            content.textContent =
                                cleanAnswer(
                                    fullAnswer
                                );

                            scrollToBottom();
                        }

                    } catch (error) {

                        if (
                            error.message &&
                            !error.message.includes(
                                "Unexpected token"
                            )
                        ) {
                            throw error;
                        }
                    }
                }
            }


            clearInterval(statusTimer);


            const cleanedAnswer =
                cleanAnswer(fullAnswer);


            if (!cleanedAnswer) {

                loading.remove();

                content.textContent =
                    "ИИ не вернул ответ.";

            } else {

                content.textContent =
                    cleanedAnswer;
            }


            /*
             * Ассистентский ответ добавляется
             * после завершения streaming.
             */
            conversationHistory.push({
                role: "assistant",
                content: cleanedAnswer
            });

            saveHistory();
            renderHistory();


        } catch (error) {

            clearInterval(statusTimer);

            loading.remove();

            /*
             * Если сервер не ответил,
             * убираем пользовательское сообщение
             * из истории, чтобы не сохранять
             * несуществующий диалог.
             */
            if (
                conversationHistory.length > 0 &&
                conversationHistory[
                    conversationHistory.length - 1
                ].role === "user" &&
                conversationHistory[
                    conversationHistory.length - 1
                ].content === text
            ) {

                conversationHistory.pop();

                saveHistory();
                renderHistory();
            }


            content.textContent =
                "Ошибка: " +
                (error.message || "Неизвестная ошибка");

            console.error(
                "Chat error:",
                error
            );

        } finally {

            /*
             * Кнопка и поле ВСЕГДА возвращаются
             * в рабочее состояние.
             */
            clearInterval(statusTimer);

            isGenerating = false;

            send.disabled = false;
            input.disabled = false;

            input.focus();

            scrollToBottom();
        }
    }


    /* =========================
       SEND BUTTON
       ========================= */

    send.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            if (isGenerating) {
                return;
            }

            sendMessage();
        }
    );


    /* =========================
       ENTER
       ========================= */

    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                if (isGenerating) {
                    return;
                }

                sendMessage();
            }
        }
    );


    /* =========================
       TEXTAREA AUTO SIZE
       ========================= */

    input.addEventListener(
        "input",
        function() {

            this.style.height = "40px";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    160
                ) + "px";
        }
    );


    /* =========================
       NEW CHAT
       ========================= */

    newChat.addEventListener(
        "click",
        function() {

            if (isGenerating) {
                return;
            }

            conversationHistory = [];

            currentChatTitle =
                "Новый чат";

            saveHistory();
            renderHistory();

            showWelcome();

            setRandomPlaceholder();

            input.value = "";

            input.style.height = "40px";

            input.focus();
        }
    );


    /* =========================
       PLACEHOLDER ROTATION
       ========================= */

    function startPlaceholderRotation() {

        if (placeholderTimer) {
            clearInterval(placeholderTimer);
        }

        setRandomPlaceholder();

        placeholderTimer =
            setInterval(() => {

                /*
                 * Пока пользователь что-то пишет,
                 * placeholder не меняем.
                 */
                if (input.value.trim()) {
                    return;
                }

                input.style.setProperty(
                    "--placeholder-opacity",
                    "0"
                );

                input.placeholder = randomItem(
                    placeholders
                );

            }, 3500);
    }


    /* =========================
       INITIALIZE
       ========================= */

    loadHistory();

    startPlaceholderRotation();

    startWelcomeAnimation();

    input.focus();

</script>

</body>
</html>
